[project]
name = "wuji-dexterous-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "imageio[ffmpeg]>=2.38.0",
    "mink>=1.3.0",
    "mujoco>=3.14.0",
    "opencv-python-headless>=5.0.0.93",
    "pytest>=9.1.1",
    "smplx>=0.1.28",
    "torch>=2.14.0",
    "wuji-retargeting",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
wuji-retargeting = { git = "https://github.com/wuji-technology/wuji-retargeting", rev = "531f6ed4250b475d2e9231f54e988fc9b1c5b4ea" }

# Install wuji_cap into the uv env (editable) so scripts/ and tests/ can import it (B1, human-approved 2026-09-29).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wuji_cap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
